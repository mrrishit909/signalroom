version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_store
    columns:
      - name: store_id
        tests: [unique, not_null]
  - name: fact_sales
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: store_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled']
  - name: fact_inventory
    columns:
      - name: movement_id
        tests: [unique, not_null]
